name: Desktop app

# Builds the ready-made CNPK-Portal program and tests the built program end to
# end (launcher/smoke_test.py). Windows and Linux on every change to the app;
# macOS (billed at 10x on private repositories) only for version tags or when
# started by hand. A tag such as v1.2.0 also publishes a GitHub release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "launcher/**"
      - "src/**"
      - "requirements.txt"
      - "deploy/compile_po.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older build pointless (saves Actions minutes).
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && '["windows-2022", "ubuntu-22.04"]' || '["windows-2022", "ubuntu-22.04", "macos-14"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: launcher/requirements*.txt
      - name: Install build tools
        run: pip install -r launcher/requirements-build.txt
      - name: Build the program
        id: build
        run: python launcher/build.py
      - name: Test the built program end to end
        shell: bash
        run: python launcher/smoke_test.py "dist/CNPK-Portal/CNPK-Portal${{ runner.os == 'Windows' && '.exe' || '' }}"
      # Unzipped once by GitHub: the program folder, ready to use (Windows).
      - name: Upload the program folder
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.package }}
          path: dist/CNPK-Portal/
          if-no-files-found: error
          retention-days: 30
      # The zip keeps the "executable" flag that macOS and Linux need; also used for releases.
      - name: Upload the download package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.build.outputs.package }}
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: packages
      # Works for a tag pushed with git and for a release created on GitHub's Releases page.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" packages/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "CN-PK Consignment Portal $GITHUB_REF_NAME" \
              --notes "Desktop edition. Download the zip for your computer, unzip it and start CNPK-Portal. Guide: docs/05-run-on-your-computer.md"
          fi
