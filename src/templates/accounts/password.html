{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Change password" %}{% endblock %}
{% block content %}
<div class="page-head"><h1>{% trans "Change password" %}</h1></div>
<div class="card" style="max-width:560px">
  <form method="post">{% csrf_token %}
    <div class="form-grid">{% include "_fields.html" %}</div>
    <div class="form-actions"><button class="btn primary" type="submit">{% trans "Save" %}</button>
      <a class="btn" href="{% url 'accounts:account' %}">{% trans "Cancel" %}</a></div>
  </form>
</div>
{% endblock %}
