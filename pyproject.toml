[project]
name = "cnpk-consignment-portal"
version = "0.1.0"
description = "Consignment tracking, item-level traceability and document exchange between a shipper in China and a receiver in Pakistan"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B904", "B905"]
